# Standalone compose file — run directly on the homelab VM via
# `docker compose up -d --build`.
#
# The build context is a git URL, not a local path: Docker/BuildKit clones
# github.com/Kai-Doh/noteapp at build time and uses the src-tauri/ subdir
# (`#main:src-tauri`) as context, so only this one file needs to live on the
# VM — no more manually vendoring the source tree into a homelab stacks repo.
# The Dockerfile only ever COPYs Cargo.toml/Cargo.lock/migrations/src (see
# Dockerfile) — none of the frontend/Tauri desktop-app source is needed for
# this build, so the desktop/Windows/Linux app stays a separate, manual
# `npm run tauri build` step untouched by this file.
services:
  noteapp:
    build:
      context: https://github.com/Kai-Doh/noteapp.git#main:src-tauri
      dockerfile: Dockerfile
    image: noteapp-server:latest
    container_name: noteapp
    restart: unless-stopped
    ports:
      - "47823:47823"
    volumes:
      - noteapp-data:/data
    environment:
      NOTEAPP_BIND_ADDR: "0.0.0.0:47823"

volumes:
  noteapp-data:
    name: noteapp-data
