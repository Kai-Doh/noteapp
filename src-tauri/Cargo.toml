[package]
name = "noteapp"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"
# Two binaries now live here: `noteapp` (the Tauri desktop thin client) and
# `server` (headless, for Docker). `cargo run`/`tauri dev` need a default
# since there's no longer exactly one binary to infer.
default-run = "noteapp"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "noteapp_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = ["desktop"]
# Everything Tauri/GUI-specific lives behind this feature so the headless
# `server` binary (built with `--no-default-features` for the Docker image)
# never pulls in Tauri at all — on Linux, the `tauri` crate's own build
# script requires webkit2gtk/gtk3 dev packages via pkg-config just to
# *compile*, which a headless container has no business needing.
desktop = ["dep:tauri", "dep:tauri-plugin-opener", "dep:tauri-build"]

[build-dependencies]
tauri-build = { version = "2", features = [], optional = true }

[dependencies]
tauri = { version = "2", features = [], optional = true }
tauri-plugin-opener = { version = "2", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

rusqlite = { version = "0.31", features = ["bundled", "backup"] }
r2d2 = "0.8"
r2d2_sqlite = { version = "0.24", features = ["bundled"] }
refinery = { version = "0.8", features = ["rusqlite"] }

axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }

uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
blake3 = "1"
rand = "0.8"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dirs = "5"

