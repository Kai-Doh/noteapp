# Builds the desktop client for Windows, macOS, and Linux and attaches the
# installers to a (draft) GitHub Release. Triggered by pushing a version tag:
#
#   1. Bump "version" in both package.json and src-tauri/tauri.conf.json.
#   2. git commit, then: git tag v0.1.1 && git push origin v0.1.1
#   3. This workflow runs, builds all 3 platforms, and creates a DRAFT
#      release with the installers attached — review it on GitHub and click
#      "Publish release" yourself; nothing goes public automatically.
#
# The Docker/server side is untouched by this — the homelab deployment
# builds live from source via its own git-context docker-compose.yml
# (src-tauri/docker-compose.yml), unrelated to this workflow.
#
# Artifacts are signed for the in-app auto-updater (tauri-plugin-updater):
# TAURI_SIGNING_PRIVATE_KEY / TAURI_SIGNING_PRIVATE_KEY_PASSWORD are repo
# secrets (private key generated via `tauri signer generate`, kept outside
# the repo — see the noteapp_github_repo memory for where). Once you
# publish a draft release, `includeUpdaterJson` has already uploaded a
# combined `latest.json` covering all platforms, which every installed
# copy of the app checks against on launch.
name: release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Two arch-specific macOS builds rather than one --target
          # universal-apple-darwin: Tauri's universal-build lipo step has a
          # known issue with multi-binary crates (this repo also builds a
          # headless `server` bin for Docker) — it ignores Cargo.toml's
          # default-run and tries to bundle the wrong binary. Building each
          # arch separately avoids that code path entirely.
          - platform: "macos-latest"
            args: "--target aarch64-apple-darwin"
          - platform: "macos-latest"
            args: "--target x86_64-apple-darwin"
          - platform: "ubuntu-22.04"
            args: ""
          - platform: "windows-latest"
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: install Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: install frontend dependencies
        run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "noteapp ${{ github.ref_name }}"
          releaseBody: "See the assets below to download and install this version."
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          args: ${{ matrix.args }}
